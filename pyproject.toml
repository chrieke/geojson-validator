[project]
name = "geojson-validator"
version = "0.6.0"
description = "Validates and fixes GeoJSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christoph Rieke", email = "christoph.k.rieke@gmail.com" }]
keywords = ["geojson", "validation", "GIS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers"
]
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "requests",
    "black",
    "pytest",
    "pylint",
    "pytest-sugar",
    "mypy",
    "types-requests",
    "grip",
    "twine",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geojson_validator"]

[tool.setuptools.package-data]
geojson_validator = ["py.typed"]

[tool.mypy]
files = ["geojson_validator"]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/chrieke/geojson-validator"
Changelog = "https://github.com/chrieke/geojson-validator/changelog"
